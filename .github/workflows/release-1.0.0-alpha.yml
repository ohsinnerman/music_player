# One-off: publish the 1.0.0-alpha release (tag v1.0.0-alpha on 9812ede) with
# the APK that the "latest" build produced for that commit. Idempotent.
name: Release 1.0.0-alpha

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-1.0.0-alpha.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: 9812ede
    steps:
      - name: Fetch the 1.0.0-alpha APK
        id: apk
        run: |
          set -e
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0-alpha" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "full=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .sha)" >> "$GITHUB_OUTPUT"
          gh release download latest -R "$GITHUB_REPOSITORY" -p "aura-1.0.0-$SHA.apk"
          echo "exists=false" >> "$GITHUB_OUTPUT"
      - name: Publish v1.0.0-alpha
        if: steps.apk.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-alpha
          target_commitish: ${{ steps.apk.outputs.full }}
          name: Aura 1.0.0-alpha
          prerelease: true
          make_latest: false
          body: |
            First public alpha. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md#100-alpha--2026-11-09).
            Install **aura-1.0.0-${{ env.SHA }}.apk** on Android 8+.
          files: aura-1.0.0-${{ env.SHA }}.apk
