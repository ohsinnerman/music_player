plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.auracast'
version = '1.1.0'

android {
  namespace "expo.modules.auracast"
  defaultConfig {
    versionCode 2
    versionName "1.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // Google Cast sender (Chromecast, Google TV, Nest, Cast-enabled TVs / receivers).
  implementation "com.google.android.gms:play-services-cast-framework:22.3.1"
}
