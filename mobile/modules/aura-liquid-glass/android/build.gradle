// Haze (chrisbanes/haze) is a Jetpack Compose library, so this module compiles Compose.
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.auraliquidglass'
version = '1.1.0'

android {
  namespace "expo.modules.auraliquidglass"
  defaultConfig {
    versionCode 2
    versionName "1.1.0"
    // Keeps the blur target's RenderNode field readable after R8 in release builds.
    consumerProguardFiles 'proguard-rules.pro'
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  // Haze 2.1.0: Glass effect + its Material 3 Glass Style factory.
  def haze = "2.1.0"
  implementation "dev.chrisbanes.haze:haze:$haze"
  implementation "dev.chrisbanes.haze:haze-glass:$haze"
  implementation "dev.chrisbanes.haze:haze-glass-material3:$haze"

  // Same Compose as Haze 2.1.0 and expo-ui (SDK 58).
  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.material3:material3-android:1.4.0'
}
